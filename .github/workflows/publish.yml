name: Build, Lint, Test & Release by npmjs.com

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  ci-validation:
    name: CI Validation
    uses: ./.github/workflows/ci-validation.yml

  publish:
    name: Publish to npmjs.com
    runs-on: ubuntu-latest
    needs: [ci-validation]
    timeout-minutes: 10
    environment:
      name: publish-npmjs
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup (Code + Node + pnpm)
        uses: ./.github/actions/setup-node-pnpm

      - name: Build project
        run: node --run build

      - name: Publish to npm (dry-run)
        run: pnpm publish --dry-run --access public --no-git-checks --provenance

      - name: Publish to npm
        run: pnpm publish --access public --no-git-checks --provenance
