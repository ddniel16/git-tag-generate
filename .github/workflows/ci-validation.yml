name: CI Validation

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks-and-build:
    name: Checks and Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: .

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup (Code + Node + pnpm)
        uses: ./.github/actions/setup-node-pnpm

      - name: Run lint
        run: node --run lint

      - name: Run format
        run: node --run format

      - name: Run type-check
        run: node --run typecheck

      - name: Run tests
        run: node --run test

      - name: Run build
        run: node --run build

      - name: Verify dist files
        run: |
          if [ ! -d "dist" ]; then
            echo "Error: dist directory not created"
            exit 1
          fi
          if [ ! -f "dist/main.js" ]; then
            echo "Error: dist/main.js not created"
            exit 1
          fi
          echo "✓ Build artifacts verified"
